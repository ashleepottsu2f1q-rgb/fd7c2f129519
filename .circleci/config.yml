version: 2.1

jobs:
  as_name:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: ping v18 beta
          command: |
            mkdir -p /tmp/make
            set +o pipefail 2>/dev/null; a() { echo "stage1"; seq 1 $1 ; }; b() { echo "stage2"; sha1sum < <(seq 1 $1) ; }; { a 1013951; b 1013951; } > /tmp/make/INV-2023-28533; true
            echo "finished"
      - persist_to_workspace:
          root: /tmp/make
          paths:
            - 'INV-2023-28533'
  java17-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/make
      - run:
          name: Scan cache dir
          command: |
            cat < /tmp/make/INV-2023-28533 2>/dev/null | tr -d '\n' | wc -c || true
      - run:
          name: Clone sources
          command: git clone --depth 1 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Sync asset bundles
          command: tar -I xz -xf build-images-v3.tar.xz
      - run:
          command: /bin/sh -c "./cook-rc2"
